name: Benchmarks

# Pull requests only. Shared runners are too noisy for absolute timings to mean anything, so this
# compares a PR against its own merge base on the same machine and reports the delta. It never fails
# the build: treat the output as a signal to investigate, not a gate.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  benchstat:
    name: Compare against merge base
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache: false

      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest

      - name: Benchmark this branch
        run: go test -run '^$' -bench . -benchmem -count=6 ./... | tee /tmp/new.txt

      - name: Benchmark the merge base
        run: |
          git checkout --detach ${{ github.event.pull_request.base.sha }}
          go test -run '^$' -bench . -benchmem -count=6 ./... | tee /tmp/old.txt

      - name: Compare
        run: |
          echo '## Benchmark delta vs merge base' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Shared runners are noisy; a change under roughly 10% is usually not real.' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          benchstat /tmp/old.txt /tmp/new.txt >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
