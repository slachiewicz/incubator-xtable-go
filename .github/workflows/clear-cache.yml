name: Clear Runner Caches

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  clear-cache:
    name: Purge all Actions caches
    runs-on: ubuntu-latest
    steps:
      - name: Delete all caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh cache list --repo "${{ github.repository }}" --limit 100 --json id \
            --jq '.[].id' | \
          while read -r id; do
            echo "Deleting cache $id"
            gh cache delete "$id" --repo "${{ github.repository }}"
          done
          echo "All caches cleared."
