name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Artifacts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, ubuntu-24.04-arm]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          check-latest: true
          cache: true

      # Pure Go, no cgo, so one runner cross-builds every platform. Running this on all
      # three runners would triplicate identical binaries across the merged artifacts.
      - name: Build CLI binaries
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -v -ldflags="-s -w" -o dist/polytable-linux-amd64 ./cmd/polytable
          GOOS=linux GOARCH=arm64 go build -v -ldflags="-s -w" -o dist/polytable-linux-arm64 ./cmd/polytable
          GOOS=darwin GOARCH=amd64 go build -v -ldflags="-s -w" -o dist/polytable-darwin-amd64 ./cmd/polytable
          GOOS=darwin GOARCH=arm64 go build -v -ldflags="-s -w" -o dist/polytable-darwin-arm64 ./cmd/polytable
          
          GOOS=linux GOARCH=amd64 go build -v -ldflags="-s -w" -o dist/polytable-service-linux-amd64 ./cmd/polytable-service
          GOOS=linux GOARCH=arm64 go build -v -ldflags="-s -w" -o dist/polytable-service-linux-arm64 ./cmd/polytable-service
          GOOS=darwin GOARCH=amd64 go build -v -ldflags="-s -w" -o dist/polytable-service-darwin-amd64 ./cmd/polytable-service
          GOOS=darwin GOARCH=arm64 go build -v -ldflags="-s -w" -o dist/polytable-service-darwin-arm64 ./cmd/polytable-service

      - name: Build WebAssembly Engine
        if: matrix.os == 'ubuntu-latest'
        run: |
          GOOS=js GOARCH=wasm go build -v -ldflags="-s -w" -o dist/polytable.wasm ./cmd/polytable-wasm
          ls -lh dist/polytable.wasm

      - name: Build C-Shared Dynamic Libraries (Linux AMD64)
        if: matrix.os == 'ubuntu-latest'
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=1 go build -buildmode=c-shared -o dist/libpolytable-linux-amd64.so ./bindings/c
          ls -lh dist/libpolytable-linux-amd64.so

      - name: Build C-Shared Dynamic Libraries (Linux ARM64)
        if: matrix.os == 'ubuntu-24.04-arm'
        run: |
          GOOS=linux GOARCH=arm64 CGO_ENABLED=1 go build -buildmode=c-shared -o dist/libpolytable-linux-arm64.so ./bindings/c
          ls -lh dist/libpolytable-linux-arm64.so

      - name: Build C-Shared Dynamic Libraries (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=1 go build -buildmode=c-shared -o dist/libpolytable-darwin-amd64.dylib ./bindings/c
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=1 go build -buildmode=c-shared -o dist/libpolytable-darwin-arm64.dylib ./bindings/c
          ls -lh dist/libpolytable-*.dylib

      

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-${{ matrix.os }}
          path: dist/*
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Display artifact structure
        run: |
          ls -R artifacts/

      - name: Generate combined checksums
        run: |
          find artifacts -type f \( -name "*.so" -o -name "*.dylib" -o -name "polytable*" -o -name "polytable-service*" -o -name "polytable.wasm" \) -exec sha256sum {} \; > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/artifacts-ubuntu-latest/*
            artifacts/artifacts-macos-latest/*
            artifacts/artifacts-ubuntu-24.04-arm/*
            SHA256SUMS.txt
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Note: This workflow creates GitHub releases for convenience during pre-donation phase.
      # Official ASF releases require additional artifacts (source tarball, signatures, DISCLAIMER-WIP)
      # and must follow the Apache Release Policy. Once donated to the ASF, separate release
      # management workflows will be required for official Apache releases.