name: Build Artifacts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build Binaries & Artifacts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          check-latest: true
          cache: true

      - name: Build CLI binaries
        run: |
          mkdir -p bin
          go build -v -ldflags="-s -w" -o bin/polytable ./cmd/polytable
          go build -v -ldflags="-s -w" -o bin/polytable-service ./cmd/polytable-service
          ./bin/polytable --help
          ./bin/polytable-service --help

      - name: Build WebAssembly Engine
        if: matrix.os == 'ubuntu-latest'
        run: |
          GOOS=js GOARCH=wasm go build -v -ldflags="-s -w" -o bin/polytable.wasm ./cmd/polytable-wasm
          ls -lh bin/polytable.wasm

      - name: Build C-Shared Dynamic Library
        run: |
          mkdir -p lib
          CGO_ENABLED=1 go build -buildmode=c-shared -o lib/libpolytable.so ./bindings/c || \
          CGO_ENABLED=1 go build -buildmode=c-shared -o lib/libpolytable.dylib ./bindings/c
          ls -la lib/
