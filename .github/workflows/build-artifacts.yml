name: Build Artifacts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build Binaries & Artifacts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          check-latest: true
          cache: true

      - name: Build CLI binaries
        run: |
          mkdir -p bin
          go build -v -o bin/xtable ./cmd/xtable
          go build -v -o bin/xtable-service ./cmd/xtable-service
          ./bin/xtable --help
          ./bin/xtable-service --help

      - name: Build WebAssembly Engine
        if: matrix.os == 'ubuntu-latest'
        run: |
          GOOS=js GOARCH=wasm go build -v -o bin/xtable.wasm ./cmd/xtable-wasm
          ls -lh bin/xtable.wasm

      - name: Build C-Shared Dynamic Library
        run: |
          mkdir -p lib
          CGO_ENABLED=1 go build -buildmode=c-shared -o lib/libxtable.so ./bindings/c || \
          CGO_ENABLED=1 go build -buildmode=c-shared -o lib/libxtable.dylib ./bindings/c
          ls -la lib/
