[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyxtable"
version = "0.1.0"
authors = [
  { name="the xtable-go authors" },
]
description = "Python bindings for xtable-go, an unofficial Go port of Apache XTable (zero-JVM lakehouse metadata translation)"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/slachiewicz/xtable-go"
"Source" = "https://github.com/slachiewicz/xtable-go"

[tool.setuptools.package-data]
"pyxtable" = ["libxtable.*"]
