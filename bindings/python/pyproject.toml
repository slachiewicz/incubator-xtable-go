[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "polytable"
version = "0.1.0"
authors = [
  { name="the polytable authors" },
]
description = "Python bindings for polytable, an unofficial Go port of Apache XTable (zero-JVM lakehouse metadata translation)"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/slachiewicz/polytable"
"Source" = "https://github.com/slachiewicz/polytable"

[tool.setuptools.package-data]
"polytable" = ["libpolytable.*"]
